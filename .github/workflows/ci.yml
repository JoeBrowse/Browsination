name: ci

on:
  push:
    branches: ['**']
    tags: ['stage-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  apk:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/stage-'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: ver
        name: Version from git
        run: |
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "name=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
        env:
          VITE_BUILD: ${{ steps.ver.outputs.name }}
      - run: npx cap sync android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk browsination-${{ steps.ver.outputs.name }}.apk
      - uses: actions/upload-artifact@v7
        with:
          name: browsination-${{ steps.ver.outputs.name }}
          path: browsination-${{ steps.ver.outputs.name }}.apk
          retention-days: 90
      # The STAGE file names the stage this commit completes. The first main build after it
      # changes creates the stage-N tag and a GitHub Release carrying the APK.
      - id: stage
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="stage-$(tr -d '[:space:]' < STAGE)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - run: cp browsination-${{ steps.ver.outputs.name }}.apk browsination-${{ steps.stage.outputs.tag }}.apk
        if: github.ref == 'refs/heads/main' && steps.stage.outputs.exists == 'false'
      - uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main' && steps.stage.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.stage.outputs.tag }}
          files: browsination-${{ steps.stage.outputs.tag }}.apk
          body: 'Debug APK for ${{ steps.stage.outputs.tag }} (build ${{ steps.ver.outputs.name }}). Install over the previous build; no uninstall needed.'
